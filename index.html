<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generador de Etiquetas - Miyu Studio</title>

<!-- Fuente Acumin -->
<link rel="stylesheet" href="https://use.typekit.net/cvj7lhi.css">

<!-- Librerías -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================
   FUENTE MIOGE
   MANTÉN AQUÍ TU CÓDIGO @font-face REAL
========================================= */

@font-face {
    font-family: "Mioge";

    /* PEGA AQUÍ TU FUENTE MIOGE */
    /* src: url(...) format("truetype"); */
}


/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
}

body {
    font-family: "acumin-variable", Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 30px;
}


/* =========================================
   CONTENEDOR PRINCIPAL
========================================= */

.main-container {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
}


/* =========================================
   FORMULARIO
========================================= */

.form-container {
    width: 340px;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.form-title {
    margin: 0 0 20px 0;
    font-size: 24px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
    margin-bottom: 5px;
}

input,
textarea {
    width: 100%;
    padding: 10px;
    font-family: "acumin-variable", Arial, sans-serif;
    font-size: 15px;
    border: 1px solid #999;
    border-radius: 7px;
    background: white;
}

textarea {
    resize: vertical;
    min-height: 70px;
}


/* =========================================
   BOTONES
========================================= */

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-family: "acumin-variable", Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 12px;
}

button:hover {
    background: #333;
}

.btn-pdf {
    margin-top: 8px;
}


/* =========================================
   CONTADOR
========================================= */

.contador {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
}


/* =========================================
   ETIQUETA
   9 x 9 CM
========================================= */

.label-box {
    width: 9cm;
    height: 9cm;

    position: relative;

    background: white;

    border: 2px solid black;
    border-radius: 18px;

    padding: 16px 18px;

    display: flex;
    flex-direction: column;

    gap: 9px;

    overflow: hidden;
}


/* =========================================
   TITULO
========================================= */

.title-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 2px;
}

.miyu {
    font-family: "Mioge", serif;
    font-size: 38px; /* antes 40px */
    font-weight: 600;
    line-height: 0.9;
    letter-spacing: 4px;
    text-align: center;
}

.studio {
    font-family: "acumin-variable", Arial, sans-serif;
    font-size: 13px; /* antes 15px */
    font-weight: 600;
    letter-spacing: 3px;
    text-align: center;
    margin-top: 2px;
}


/* =========================================
   SEPARADOR
========================================= */

.separator {
    width: 100%;
    border-bottom: 1.5px solid black;
    margin: 4px 0 5px 0;
}


/* =========================================
   FILAS
========================================= */

.row {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    width: 100%;
}

.label {
    flex-shrink: 0;
    font-size: 14px; /* antes 16px */
    font-weight: 700;
    line-height: 1.2;
}

.value {
    font-size: 14px; /* antes 16px */
    font-weight: 400;
    line-height: 1.2;
    word-break: break-word;
    flex: 1;
}


/* =========================================
   FECHA
========================================= */

.fecha-envio {
    position: absolute;
    right: 16px;
    bottom: 12px;

    font-family: "acumin-variable", Arial, sans-serif;

    font-size: 9px; /* antes 11px */
    font-weight: 600;

    text-align: right;

    opacity: 0.75;
}


/* =========================================
   PREVIEW AREA
========================================= */

.preview-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.preview-title {
    margin-top: 0;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 800px) {

    body {
        padding: 20px;
    }

    .main-container {
        justify-content: center;
    }

    .label-box {
        transform: scale(0.9);
        transform-origin: top center;
        margin-bottom: -25px;
    }

}

</style>

</head>

<body>


<div class="main-container">


    <!-- =====================================
         FORMULARIO
    ====================================== -->

    <div class="form-container">

        <h2 class="form-title">
            Generador de Etiquetas
        </h2>


        <label>Distrito</label>
        <input
            type="text"
            id="distrito"
            placeholder="Ej: San Martín de Porres"
        >


        <label>Dirección</label>
        <input
            type="text"
            id="direccion"
            placeholder="Ej: San Orlando 946"
        >


        <label>Nombre</label>
        <input
            type="text"
            id="recibe"
            placeholder="Nombre del cliente"
        >


        <label>Celular</label>
        <input
            type="text"
            id="celular"
            placeholder="Ej: 990958896"
        >


        <label>Comentario</label>
        <textarea
            id="referencia"
            placeholder="Referencia o comentario"
        ></textarea>


        <label>Fecha de envío</label>
        <input
            type="date"
            id="fecha_envio"
        >


        <!-- BOTON AGREGAR -->

        <button
            type="button"
            onclick="agregarEtiqueta()"
        >
            Agregar etiqueta
        </button>


        <!-- BOTON PDF -->

        <button
            type="button"
            class="btn-pdf"
            onclick="descargarPDF()"
        >
            Descargar PDF
        </button>


        <!-- CONTADOR -->

        <div class="contador">
            Etiquetas acumuladas:
            <span id="contador">0</span>
        </div>

    </div>



    <!-- =====================================
         PREVIEW
    ====================================== -->

    <div class="preview-area">

        <h3 class="preview-title">
            Vista previa
        </h3>

        <div
            class="label-box"
            id="preview"
        >

            <div class="title-wrapper">

                <div class="miyu">
                    MIYU
                </div>

                <div class="studio">
                    STUDIO
                </div>

            </div>


            <div class="separator"></div>


            <div class="row">

                <span class="label">
                    DISTRITO:
                </span>

                <span
                    class="value"
                    id="p_distrito"
                ></span>

            </div>


            <div class="row">

                <span class="label">
                    DIRECCIÓN:
                </span>

                <span
                    class="value"
                    id="p_direccion"
                ></span>

            </div>


            <div class="row">

                <span class="label">
                    NOMBRE:
                </span>

                <span
                    class="value"
                    id="p_recibe"
                ></span>

            </div>


            <div class="row">

                <span class="label">
                    CELULAR:
                </span>

                <span
                    class="value"
                    id="p_celular"
                ></span>

            </div>


            <div class="row">

                <span class="label">
                    COMENTARIO:
                </span>

                <span
                    class="value"
                    id="p_referencia"
                ></span>

            </div>


            <div
                class="fecha-envio"
                id="p_fecha_envio"
            ></div>

        </div>

    </div>


</div>



<script>

/* =====================================
   LISTA DE ETIQUETAS ACUMULADAS
===================================== */

const etiquetas = [];


/* =====================================
   ACTUALIZAR PREVIEW
===================================== */

function generarEtiqueta() {

    document.getElementById("p_recibe").textContent =
        document.getElementById("recibe").value;

    document.getElementById("p_celular").textContent =
        document.getElementById("celular").value;

    document.getElementById("p_distrito").textContent =
        document.getElementById("distrito").value;

    document.getElementById("p_direccion").textContent =
        document.getElementById("direccion").value;

    document.getElementById("p_referencia").textContent =
        document.getElementById("referencia").value;


    const fechaInput =
        document.getElementById("fecha_envio").value;


    if (fechaInput) {

        const [yyyy, mm, dd] =
            fechaInput.split("-");

        const formato =
            `${dd}/${mm}/${yyyy}`;

        document.getElementById("p_fecha_envio").textContent =
            "Envío: " + formato;

    } else {

        document.getElementById("p_fecha_envio").textContent = "";

    }

}


/* =====================================
   AGREGAR ETIQUETA A LA LISTA
===================================== */

function agregarEtiqueta() {

    const recibe =
        document.getElementById("recibe").value.trim();

    const celular =
        document.getElementById("celular").value.trim();

    const distrito =
        document.getElementById("distrito").value.trim();

    const direccion =
        document.getElementById("direccion").value.trim();

    const referencia =
        document.getElementById("referencia").value.trim();

    const fecha =
        document.getElementById("fecha_envio").value;


    /* Validar */

    if (
        !recibe ||
        !celular ||
        !distrito ||
        !direccion ||
        !fecha
    ) {

        alert(
            "Completa los datos principales antes de agregar la etiqueta."
        );

        return;

    }


    /* Guardar */

    etiquetas.push({

        recibe: recibe,
        celular: celular,
        distrito: distrito,
        direccion: direccion,
        referencia: referencia,
        fecha: fecha

    });


    /* Actualizar vista previa */

    generarEtiqueta();


    /* Actualizar contador */

    document.getElementById("contador").textContent =
        etiquetas.length;


    /* Limpiar formulario */

    document.getElementById("recibe").value = "";

    document.getElementById("celular").value = "";

    document.getElementById("distrito").value = "";

    document.getElementById("direccion").value = "";

    document.getElementById("referencia").value = "";

    document.getElementById("fecha_envio").value = "";


    alert(
        "Etiqueta agregada correctamente. Total: " +
        etiquetas.length
    );

}


/* =====================================
   CREAR ETIQUETA TEMPORAL PARA PDF
===================================== */

function crearEtiquetaTemporal(datos) {

    const [yyyy, mm, dd] =
        datos.fecha.split("-");

    const fechaFormateada =
        `${dd}/${mm}/${yyyy}`;


    const etiqueta =
        document.createElement("div");


    etiqueta.className =
        "label-box";


    etiqueta.style.position =
        "absolute";


    etiqueta.style.left =
        "-10000px";


    etiqueta.style.top =
        "0";


    etiqueta.innerHTML = `

        <div class="title-wrapper">

            <div class="miyu">
                MIYU
            </div>

            <div class="studio">
                STUDIO
            </div>

        </div>

        <div class="separator"></div>


        <div class="row">

            <span class="label">
                DISTRITO:
            </span>

            <span class="value">
                ${datos.distrito}
            </span>

        </div>


        <div class="row">

            <span class="label">
                DIRECCIÓN:
            </span>

            <span class="value">
                ${datos.direccion}
            </span>

        </div>


        <div class="row">

            <span class="label">
                NOMBRE:
            </span>

            <span class="value">
                ${datos.recibe}
            </span>

        </div>


        <div class="row">

            <span class="label">
                CELULAR:
            </span>

            <span class="value">
                ${datos.celular}
            </span>

        </div>


        <div class="row">

            <span class="label">
                COMENTARIO:
            </span>

            <span class="value">
                ${datos.referencia}
            </span>

        </div>


        <div class="fecha-envio">
            Envío: ${fechaFormateada}
        </div>

    `;


    document.body.appendChild(etiqueta);


    return etiqueta;

}


/* =====================================
   DESCARGAR TODAS LAS ETIQUETAS EN PDF
===================================== */

async function descargarPDF() {


    if (etiquetas.length === 0) {

        alert(
            "Primero debes agregar al menos una etiqueta."
        );

        return;

    }


    const { jsPDF } =
        window.jspdf;


    const pdf =
        new jsPDF({

            orientation: "portrait",

            unit: "mm",

            format: "a4"

        });


    /* =====================================
       MEDIDAS
    ====================================== */

    const pageW =
        pdf.internal.pageSize.getWidth();


    const pageH =
        pdf.internal.pageSize.getHeight();


    /* Cada etiqueta mide 9 cm */

    const boxW = 90;
    const boxH = 90;


    /* Márgenes */

    const margenIzquierdo = 5;
    const margenSuperior = 5;


    /* Espacio entre etiquetas */

    const espacioX = 5;
    const espacioY = 5;


    /*
       2 columnas:

       [Etiqueta] espacio [Etiqueta]

       Luego siguiente fila hacia abajo.
    */

    const columnas = 2;


    /* Posición actual */

    let x =
        margenIzquierdo;

    let y =
        margenSuperior;

    let columnaActual =
        0;


    /* =====================================
       GENERAR CADA ETIQUETA
    ====================================== */

    for (let i = 0; i < etiquetas.length; i++) {


        const datos =
            etiquetas[i];


        /* Crear etiqueta temporal */

        const etiqueta =
            crearEtiquetaTemporal(datos);


        /* Esperar que renderice */

        await new Promise(resolve =>
            setTimeout(resolve, 100)
        );


        /* Convertir a canvas */

        const canvas =
            await html2canvas(etiqueta, {

                scale: 4,

                useCORS: true,

                backgroundColor: "#ffffff"

            });


        const imgData =
            canvas.toDataURL("image/png");


        /* Agregar al PDF */

        pdf.addImage(

            imgData,

            "PNG",

            x,

            y,

            boxW,

            boxH

        );


        /* Eliminar etiqueta temporal */

        etiqueta.remove();


        /* =================================
           SIGUIENTE POSICIÓN
        ================================= */


        columnaActual++;


        /*
           Si ya pusimos 2 etiquetas
           volvemos a la izquierda
           y bajamos una fila
        */

        if (columnaActual >= columnas) {

            columnaActual = 0;

            x =
                margenIzquierdo;

            y +=
                boxH + espacioY;

        }

        else {

            /*
               Mover a la derecha
            */

            x +=
                boxW + espacioX;

        }


        /* =================================
           NUEVA PÁGINA
        ================================= */


        /*
           Si la siguiente fila
           ya no entra en A4
        */

        if (
            columnaActual === 0 &&
            y + boxH > pageH - margenSuperior &&
            i < etiquetas.length - 1
        ) {

            pdf.addPage();


            x =
                margenIzquierdo;


            y =
                margenSuperior;

        }

    }


    /* =====================================
       DESCARGAR PDF
    ====================================== */

    pdf.save(
        "etiquetas-miyu.pdf"
    );

}

</script>

</body>
</html>
